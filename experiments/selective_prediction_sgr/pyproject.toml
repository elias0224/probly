[project]
name = "selective-prediction-sgr"
version = "0.1.0"
description = "Reproduce Table 1 of Geifman and El-Yaniv (2017) with MC dropout and probly's selective prediction."
requires-python = ">=3.13"
dependencies = [
  "probly",
  "torch>=2.6",
  "torchvision",
  "numpy",
  "matplotlib",
  "scipy>=1.18.1",
  "laplace-torch>=0.2.0",
  "curvlinops-for-pytorch>=2.0,<3.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
probly = { path = "../..", editable = true }
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/sgr_experiment"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
