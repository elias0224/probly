# Reusable workflow: Build Sphinx documentation
# Called by CI (strict mode) and deploy (permissive mode)
name: Build Sphinx Docs

on:
  workflow_call:
    inputs:
      strict:
        description: "Treat warnings as errors (-W flag)"
        type: boolean
        default: false
      docs-cache:
        description: "Restore the docs build cache; only changed examples and API pages are rebuilt"
        type: boolean
        default: false

permissions:
    contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
            persist-credentials: false
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v7.0.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Restore docs build cache
        if: inputs.docs-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            docs/source/auto_examples
            docs/source/gen_modules
            docs/source/api
            docs/build
          key: sphinx-docs-${{ hashFiles('uv.lock') }}-${{ github.run_id }}
          restore-keys: |
            sphinx-docs-${{ hashFiles('uv.lock') }}-
      - name: Normalize file mtimes for incremental build
        # Gives unchanged files an old mtime so Sphinx keeps their cached
        # output; runs unconditionally so cold builds produce the manifest.
        run: uv run python docs/source/_normalize_source_mtimes.py
      - name: Prune stale API pages
        run: uv run python docs/source/_prune_stale_api.py
      - name: Build Sphinx documentation
        run: uv run sphinx-build ${{ inputs.strict && '-W' || '' }} -b html docs/source docs/build/html
        env:
          # Only re-execute examples whose source changed; kept constant
          # across CI builds so the cached environment sees no config change.
          PROBLY_DOCS_RUN_STALE_EXAMPLES: "0"
      - name: Save docs build cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            docs/source/auto_examples
            docs/source/gen_modules
            docs/source/api
            docs/build
          key: sphinx-docs-${{ hashFiles('uv.lock') }}-${{ github.run_id }}
      - name: Upload docs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sphinx-docs
          path: docs/build/html
