# Deploy docs to GitHub Pages: /latest/ from main, /stable/ from the newest
# release's docs asset, root redirecting to /latest/ (temporary).
name: Deploy Docs
on:
  workflow_dispatch:
    inputs:
      docs-cache:
        description: "Restore the docs build cache (incremental). Leave off for a full uncached rebuild of /latest/."
        type: boolean
        default: false
  push:
    branches: [main]
  schedule:
    # One hour after the weekly Docs CI build so the docs build cache it
    # saved can be restored here and unchanged pages are not rebuilt.
    - cron: "0 5 * * 1"
concurrency:
    group: pages
    cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/_docs-build.yml
    permissions:
        contents: read
    with:
      # restore the cache for push and scheduled deploys (incremental);
      # manual dispatch defaults to a full rebuild but release-triggered
      # dispatches opt back into the cache
      docs-cache: ${{ github.event_name != 'workflow_dispatch' || inputs.docs-cache }}
      # Derived from the owner so a fork hosts the same site under its own
      # Pages URL. On upstream the owner is pwhofman, so these are unchanged.
      base-url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/stable/
      pages-root: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
        contents: read   # download the stable release asset
        pages: write
        id-token: write
    environment:
        name: github-pages
        url: ${{ steps.deploy.outputs.page_url }}
    env:
        GH_TOKEN: ${{ github.token }}
        UPSTREAM_REPO: pwhofman/probly
        PAGES_ROOT: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        PAGES_PATH: /${{ github.event.repository.name }}/
    steps:
      - name: Download latest docs artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: sphinx-docs
          path: site/latest
      - name: Fetch stable docs from the newest release
        # On upstream this hard-fails if the newest release has no docs asset;
        # see the rollout runbook (run Release Docs for that tag, then
        # re-deploy). A fork has no releases of its own, so it falls back to
        # the upstream asset and serves the same two-version site.
        run: |
          repo="$GITHUB_REPOSITORY"
          if [ "$repo" != "$UPSTREAM_REPO" ] && \
             ! gh release download --repo "$repo" --pattern probly-docs-html.tar.gz --output stable-docs.tar.gz 2>/dev/null; then
            echo "::notice::no docs release asset on $repo; serving /stable/ from $UPSTREAM_REPO"
            repo="$UPSTREAM_REPO"
          fi
          [ -f stable-docs.tar.gz ] || \
            gh release download --repo "$repo" --pattern probly-docs-html.tar.gz --output stable-docs.tar.gz
          mkdir -p site/stable
          tar -xzf stable-docs.tar.gz -C site/stable
          tag="$(gh release view --json tagName --jq .tagName --repo "$repo")"
          echo "STABLE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Write root redirect, 404 fallback, and versions.json
        run: |
          cat > site/index.html <<HTML
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=latest/">
            <link rel="canonical" href="$PAGES_ROOT/latest/">
            <title>probly documentation</title>
          </head>
          <body><p>Redirecting to the <a href="latest/">latest documentation</a>.</p></body>
          </html>
          HTML
          cat > site/404.html <<HTML
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>probly documentation - page not found</title>
            <script>
              // Pre-versioning deep links lack the /stable/ or /latest/
              // prefix; forward them into /stable/ once.
              var base = "$PAGES_PATH";
              var p = window.location.pathname;
              if (p.indexOf(base) === 0 &&
                  p.indexOf(base + "stable/") !== 0 &&
                  p.indexOf(base + "latest/") !== 0) {
                window.location.replace(
                  base + "stable/" + p.slice(base.length) +
                  window.location.search + window.location.hash);
              }
            </script>
          </head>
          <body>
            <p>Page not found. Try the <a href="${PAGES_PATH}stable/">stable documentation</a>
            or the <a href="${PAGES_PATH}latest/">development documentation</a>.</p>
          </body>
          </html>
          HTML
          cat > site/versions.json <<JSON
          [
            {"name": "$STABLE_TAG (stable)", "version": "stable", "url": "$PAGES_ROOT/stable/"},
            {"name": "latest (main)", "version": "latest", "url": "$PAGES_ROOT/latest/"}
          ]
          JSON
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
            path: 'site'
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
